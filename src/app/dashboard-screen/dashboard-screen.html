<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jiu Jitsu Submission Tracker</title>
</head>
<body>

<h1>Dashboard</h1>

<nav>
  <a href="/dashboard/">Dashboard</a> 
  <a href="/history/">History</a>
  <a href="/stats/">Stats</a>
  <a href="/profile/">About</a>
  <button (click)="logout()">Log Out</button>
</nav>

<div class="card">

  <div class="card-header">
    <h3>Recent Submissions</h3>

    <a href="/history/">
      <button>View All</button>
    </a>
  </div>

  <div class="submission-accuracy">
    <div class="stats-row">
      <div class="pie-chart" [style.background]="getChartGradient()"></div>

      <div class="stats-list">
        <h3><span class="legend green"></span> Succeeded</h3> 
        <h3><span class="legend red"></span> Failed</h3>
      </div>
    </div>
  </div>

      <h3>Recent Submissions</h3>


  <div class="table-container">
    <table>

      <thead>
        <tr>
          <th>Submission</th>
          <th>Training Partner</th>
          <th>Position</th>
          <th>Result</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let s of displayedSubmissions">
          <td data-label="Submission">{{ s.submission }}</td>
          <td data-label="Training Partner">{{ s.trainingPartner }}</td>
          <td data-label="Position">{{ s.position }}</td>
          <td data-label="Result">{{ s.result }}</td>
        </tr>
      </tbody>

    </table>
  </div>

</div>

</body>
</html>
