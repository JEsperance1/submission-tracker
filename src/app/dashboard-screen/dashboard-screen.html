<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jiu Jitsu Submission Tracker</title>
</head>
<body>


<h1>SubMISSION</h1>



<nav>
<a href="/dashboard/">Dashboard</a> 
<a href="/history/">History</a>
<a href="/stats/">Stats</a>
<a href="/profile/">Profile</a>
<button (click)="logout()">Log Out</button>
</nav>




<div class ="card">
    <div class="card-header">
    <h3> Recent Submissions
        <a href="/history/">
        <button>View All</button>
        </a>
        <div class="submission-accuracy">
<div class="stats-row">
    <div class="pie-chart"></div>

    <div class="stats-list">
      <h3><span class="legend green"></span> Succeeded</h3> 
      <h3><span class="legend red"></span> Failed</h3>
      <h3><span class="legend yellow"></span> Other</h3>
    </div>
  </div>
</div>
    
    </h3>
    </div>
<table>
    <tr *ngFor="let s of submissions">
        <td>{{ s.submission }}</td>
        <td>{{ s.trainingPartner }}</td>
        <td>{{ s.position }}</td>
        <td>{{ s.result }}</td>
      </tr>
</table>
</div>
</body>
</html>
