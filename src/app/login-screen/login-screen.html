<body>


<h1>SubMISSION</h1>


<div class="page">
  <div class="textFieldContainer">
    <h3>Sign up or Login</h3>

    <label for="username">Email:</label>
    <input type="text" id="username" name="username" [(ngModel)]="username">

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" [(ngModel)]="password">

    <button class="button" (click)="createUser()">Create An Account</button>


    <button class="button" (click)="signInUser()">Sign In</button> 

@if (errorMessage) {
  <div class="error">
    {{ errorMessage }}
  </div>
}
</div>

</div>
</body>
