<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jiu Jitsu Submission Tracker</title>
</head>
<body>



<h1>Stats</h1>



<nav>
<a href="/dashboard/">Dashboard</a> 
<a href="/history/">History</a>
<a href="/stats/">Stats</a>
<a href="/profile/">About</a>
<button (click)="logout()">Log Out</button>
</nav>

<div class="card">
  <h2>Submission Breakdown</h2>
  <div class="stats-row">
    
    <!-- Dynamic pie chart -->
    <div class="pie-chart" [style.background]="pieChartStyle"></div>

    <div class="stats-list">
      <h3 *ngFor="let item of submissionStats; let i = index">
        <span class="legend" [style.background]="colors[i]"></span>
        {{ item.submission }} ({{ item.count }})
      </h3>
    </div>

  </div>
</div>


</body>
